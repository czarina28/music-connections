name: iOS build
on:
  push:
    branches: [v1.1-freemium]
  pull_request:
    branches: [v1.1-freemium]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1-freemium
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Verify iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Bundle StoreKit bridge and prepare web assets
        run: |
          mkdir -p www
          npx esbuild storekit.js --bundle --format=iife --platform=browser --outfile=www/storekit.bundle.js
          cp index.html app.js app.css puzzles.js puzzles-26-30.js puzzles-31-35.js puzzles-36-40.js puzzles-41-50.js puzzles-51-74.js www/
      - name: Synchronize Capacitor iOS
        run: npx cap sync ios
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: music-connections-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APP_ID: com.mariaworld.musicconnections
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1-freemium
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Verify iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify required secrets
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in KEY_ID ISSUER_ID API_KEY CERTIFICATE CERT_PASSWORD PROFILE; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret for $name"; exit 1; fi
          done
      - name: Install distribution certificate and provisioning profile
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/music-connections.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple Keychain can reject otherwise valid Windows-exported PKCS#12 files.
          # Re-export with legacy-compatible PKCS#12 encryption before importing.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL" pkcs12 -in "$RUNNER_TEMP/distribution.p12" -passin env:CERT_PASSWORD -nodes -out "$RUNNER_TEMP/distribution.pem"
          "$OPENSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP/distribution.pem" -out "$RUNNER_TEMP/distribution-compatible.p12" -passout env:CERT_PASSWORD
          rm -f "$RUNNER_TEMP/distribution.pem"
          security import "$RUNNER_TEMP/distribution-compatible.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile-uuid"
          PROFILE_UUID="$(cat "$RUNNER_TEMP/profile-uuid")"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          python3 - <<'PY'
          import hashlib, os, plistlib, subprocess, sys
          p = plistlib.load(open(os.environ["RUNNER_TEMP"] + "/profile.plist", "rb"))
          team = p["TeamIdentifier"][0]
          app_identifier = p["Entitlements"]["application-identifier"]
          expected = team + "." + os.environ["APP_ID"]
          if app_identifier != expected:
              sys.exit(f"::error::Profile app identifier {app_identifier} does not match {expected}")
          if p.get("ProvisionedDevices") or p.get("ProvisionsAllDevices"):
              sys.exit("::error::Expected an App Store distribution profile, not development or ad hoc")
          allowed = {hashlib.sha1(bytes(cert)).hexdigest().upper() for cert in p["DeveloperCertificates"]}
          cert_path = os.environ["RUNNER_TEMP"] + "/distribution.p12"
          # Compare the imported signing identity against the certificates embedded in the profile.
          output = subprocess.check_output(["security", "find-identity", "-v", "-p", "codesigning",
              os.environ["RUNNER_TEMP"] + "/music-connections.keychain-db"], text=True)
          if not any(fingerprint in output for fingerprint in allowed):
              sys.exit("::error::The uploaded .p12 certificate is not included in the provisioning profile")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TEAM_ID={team}\n")
              env.write(f"PROFILE_NAME={p['Name']}\n")
          print("Signing profile matches app identifier and certificate")
          PY
      - name: Prepare App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$HOME/.private_keys"
          printf '%s\n' "$API_KEY" > "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
      - name: Install dependencies and synchronize iOS
        run: |
          npm ci
          mkdir -p www
          npx esbuild storekit.js --bundle --format=iife --platform=browser --outfile=www/storekit.bundle.js
          cp index.html app.js app.css puzzles.js puzzles-26-30.js puzzles-31-35.js puzzles-36-40.js puzzles-41-50.js puzzles-51-74.js www/
          # Enable purchase preview only in the manually triggered TestFlight build.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          html = p.read_text()
          marker = '<script src="app.js"></script>'
          assert marker in html
          p.write_text(html.replace(marker, '<script>window.MC_TESTFLIGHT_PREVIEW = true;</script>\n' + marker))
          PY
          npx cap sync ios
      - name: Archive signed iPhone app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MusicConnections.xcarchive" archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CURRENT_PROJECT_VERSION="$((1000 + GITHUB_RUN_NUMBER))"
      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>$APP_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MusicConnections.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -lh "$RUNNER_TEMP/export/"*.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-connections-testflight-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
      - name: Upload to TestFlight
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
