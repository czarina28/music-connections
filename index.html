<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Connections</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>

<main class="game">
    <header>
        <h1>MUSIC <span>CONNECTIONS</span></h1>
        <p>Find four groups of four connected by music.</p>
        <div class="session-status">
            <span>ROUND <strong id="roundNumber">1</strong></span>
            <span>SCORE <strong id="score">0</strong></span>
        </div>
    </header>

    <section id="solvedGroups" class="solved-groups"></section>
    <section id="board" class="board"></section>

    <div class="mistakes">
        Mistakes remaining:
        <span id="mistakes"></span>
    </div>

    <div class="controls">
        <button id="shuffleBtn">SHUFFLE</button>
        <button id="deselectBtn">DESELECT</button>
        <button id="nextRoundBtn">NEXT ROUND</button>
        <button id="newGameBtn" class="primary">NEW GAME</button>
        <button id="submitBtn" class="primary">SUBMIT</button>
    </div>

    <div id="message" class="message"></div>
</main>

<script src="puzzles.js"></script>
<script src="puzzles-26-30.js"></script>
<script src="puzzles-31-35.js"></script>
<script src="puzzles-36-40.js"></script>
<script src="puzzles-41-50.js"></script>
<script src="puzzles-101-124.js"></script>
<script src="app.js"></script>
</body>
</html>
